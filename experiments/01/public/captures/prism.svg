<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-label="Prism report sharing dialog">
  <rect width="720" height="600" fill="#efedf5"/>
  <path d="m41 44 14-25 14 25z" fill="#9283b1"/><text x="82" y="42" fill="#635574" font-family="Arial,sans-serif" font-size="23" font-weight="bold">prism</text>
  <text x="567" y="39" fill="#aaa0b9" font-family="Arial,sans-serif" font-size="10">REPORT LIBRARY</text>
  <line x1="38" y1="77" x2="682" y2="77" stroke="#ddd8e7"/>
  <rect x="84" y="111" width="552" height="426" rx="12" fill="#fcfbfe" stroke="#d9d1e7"/>
  <text x="114" y="155" fill="#6d5e82" font-family="Georgia,serif" font-size="26">Share this report</text><text x="601" y="151" fill="#b5aac5" font-family="Arial,sans-serif" font-size="18">×</text>
  <text x="114" y="181" fill="#aa9abb" font-family="Arial,sans-serif" font-size="11">Onboarding research · August</text>
  <text x="114" y="221" fill="#9584a9" font-family="Arial,sans-serif" font-size="10">ADD A PERSON BY EMAIL</text>
  <rect x="114" y="235" width="492" height="43" rx="5" fill="#f5f1fa" stroke="#ded5ea"/>
  <text x="131" y="261" fill="#b2a4c4" font-family="Arial,sans-serif" font-size="11">name@company.com</text><text x="540" y="261" fill="#a393b5" font-family="Arial,sans-serif" font-size="10">Viewer ⌄</text>
  <text x="114" y="317" fill="#857196" font-family="Arial,sans-serif" font-size="12" font-weight="bold">General access</text>
  <circle cx="130" cy="349" r="15" fill="#e9e1f2"/><path d="M125 347h10m-8-4h6m-8 8h10" stroke="#a490b9" fill="none"/>
  <text x="157" y="347" fill="#8b789d" font-family="Arial,sans-serif" font-size="11">People in your workspace can view</text><text x="157" y="365" fill="#b7a9c7" font-family="Arial,sans-serif" font-size="9">Anyone with access can open this report.</text>
  <line x1="114" y1="390" x2="606" y2="390" stroke="#e6deee"/>
  <text x="114" y="417" fill="#92809f" font-family="Arial,sans-serif" font-size="11">Publish to the web</text><rect x="576" y="403" width="30" height="16" rx="8" fill="#d9d0e4"/><circle cx="584" cy="411" r="6" fill="#faf8fe"/>
  <text x="114" y="437" fill="#b4a4c3" font-family="Arial,sans-serif" font-size="9">Your report will be visible to anyone with the link.</text>
  <rect x="482" y="466" width="124" height="40" rx="5" fill="#8a72a3"/><text x="513" y="491" fill="#fbf8ff" font-family="Arial,sans-serif" font-size="11">Copy link ↗</text>
  <text x="85" y="572" fill="#b9adc7" font-family="Arial,sans-serif" font-size="10">Keep the right people in the loop.</text>
